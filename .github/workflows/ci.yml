name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MonoRogue.slnx

      - name: Build
        run: dotnet build MonoRogue.slnx --no-restore

      - name: Test
        run: dotnet test MonoRogue.slnx --no-build --no-restore
